<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in · BAM CRM</title>
<style>
  :root { --bg:#000000; --card:#000000; --border:#1f1f1f; --text:#f5f5f5; --muted:#9a9aa3; --accent:#FFC107; --accent-dim:rgba(255,193,7,.12); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .login-card { width:100%; max-width:380px; background:var(--card); border:1px solid #333333; border-radius:14px; padding:24px 24px 26px; box-shadow:0 20px 50px rgba(0,0,0,.95); }
  .logo { display:block; width:150px; max-width:100%; border-radius:6px; margin:0 auto 12px; }
  .side-brand { text-align:center; font-size:15px; font-weight:700; letter-spacing:.02em; color:#fff; }
  .side-motto { margin:8px auto 14px; max-width:300px; text-align:center; background:var(--accent-dim); border:1px solid rgba(255,193,7,.4); color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.03em; padding:5px 8px; border-radius:6px; }
  .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:40px; background:#0a0a0a; border:1px solid #262626; border-radius:7px; color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; transition:border-color .15s; }
  .gbtn:hover { border-color:var(--accent); }
  .ghint { text-align:center; color:var(--muted); font-size:11px; line-height:1.35; margin-top:5px; }
  .or { display:flex; align-items:center; gap:10px; margin:12px 0 10px; color:var(--muted); font-size:11px; letter-spacing:.06em; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:#222222; }
  label { display:block; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
  .f { margin-bottom:11px; }
  input { width:100%; height:38px; background:#0a0a0a; border:1px solid #262626; border-radius:7px; color:#fff; font-size:13.5px; padding:0 11px; outline:none; transition:border-color .15s, box-shadow .15s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
  .btn-y { width:100%; height:40px; background:var(--accent); border:1px solid var(--accent); border-radius:7px; color:#000000; font-size:14px; font-weight:700; cursor:pointer; margin-top:4px; }
  .btn-y:hover { filter:brightness(1.06); }
  .back { display:block; text-align:center; margin-top:14px; color:var(--accent); font-size:12px; text-decoration:none; }
  .back:hover { text-decoration:underline; }
  .flash { padding:9px 12px; border-radius:7px; font-size:12px; line-height:1.4; margin-bottom:12px; display:none; }
  .flash-err { background:rgba(239,68,68,.12); border:1px solid #ef4444; color:#fca5a5; }
  .flash-warn { background:rgba(255,193,7,.1); border:1px solid var(--accent); color:#ffe08a; }
</style>
</head>

<script>
  // Hashed access list (SHA-256) — no passwords are stored or shown in this page.
  const USERS = {
    'sales@bigassmotors.com': { id: 1, name: 'James', role: 'admin', h: 'af9e8c6ee91c370c28329f4698175f0db748f760f3cf64c4852dba7c0db8d5f4' },
    'mattc@bigassmotors.com': { id: 4, name: 'Matt', role: 'broker', h: '9638a5784c1013d9ae003952fcfefcc83fb0a18a161c563f16cadc3647a8b704' }
  };
  async function sha(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const $ = id => document.getElementById(id);
  function show(id, html) { $('err').style.display = 'none'; $('warn').style.display = 'none'; $(id).innerHTML = html; $(id).style.display = 'block'; }
  function done(em, u, via) {
    localStorage.setItem('bam_crm_active_user_v3', JSON.stringify({ id: u.id, email: em, name: u.name, role: u.role, active: 1, google_allowed: 1, last_login_at: new Date().toISOString(), last_login_via: via }));
    location.href = 'BAM-CRM-Cockpit-Standalone.html';
  }
  $('testBypassBtn')?.addEventListener('click', () => {
    done('sales@bigassmotors.com', USERS['sales@bigassmotors.com'], 'test_bypass');
  });
  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const em = $('email').value.trim().toLowerCase();
    const u = USERS[em];
    if (!u || (await sha($('password').value)) !== u.h) { show('err', 'Wrong e-mail or password.'); return; }
    done(em, u, 'password');
  });
  $('gbtn').addEventListener('click', () => {
    const em = $('email').value.trim().toLowerCase();
    if (!em) { show('warn', 'Enter your Google e-mail above, then click Continue with Google.'); $('email').focus(); return; }
    const u = USERS[em];
    if (!u) { show('warn', "<b>We couldn't sign you in with Google.</b><br>The Google account <b>" + em.replace(/</g, '&lt;') + "</b> isn't on the Big Ass Motors CRM access list. If you work with us, ask James to add this e-mail address for you — or log in below with your e-mail and password. Thank you!"); return; }
    done(em, u, 'google');
  });
</script>
